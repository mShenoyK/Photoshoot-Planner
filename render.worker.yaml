# Optional background worker template; not required for the free inline web mode.
# Requires a supported paid plan or run the worker on your own host.
# Set QUEUE_DRIVER=bullmq on the web service and bind the same DB/Redis/S3 settings.
services:
  # Optional separate worker: requires a supported paid Render plan or an external worker host.
  - type: worker
    name: framecraft-worker
    runtime: node
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm db:generate
    startCommand: corepack pnpm worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_MODE
        value: postgres
      - key: STORAGE_DRIVER
        value: s3
      - key: QUEUE_DRIVER
        value: bullmq
      - key: AI_TEXT_PROVIDER
        value: openai
      - key: AI_IMAGE_PROVIDER
        value: openai
      - key: AI_EMBEDDINGS_PROVIDER
        value: mock
      - key: ENABLE_EMBEDDINGS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: AI_VISION_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
