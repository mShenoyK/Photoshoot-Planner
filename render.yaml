# Deployment template: not deployed, linked or smoke-tested on Render.
# Free web template: bind PostgreSQL and private S3 settings below.
# Optional paid worker template: render.worker.yaml.
services:
  - type: web
    name: framecraft-web
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm db:generate && corepack pnpm --filter @framecraft/web build
    # Free web services have no pre-deploy hook. Apply pending migrations before serving.
    startCommand: corepack pnpm db:migrate && corepack pnpm --filter @framecraft/web start
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_MODE
        value: postgres
      - key: STORAGE_DRIVER
        value: s3
      - key: QUEUE_DRIVER
        value: inline
      - key: AI_TEXT_PROVIDER
        value: mock
      - key: AI_IMAGE_PROVIDER
        value: mock
      - key: AI_EMBEDDINGS_PROVIDER
        value: mock
      - key: ENABLE_EMBEDDINGS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: WEB_BASE_URL
        sync: false
      - key: KNOWLEDGE_ADMIN_EMAILS
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
